<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modulistica Psicologo | I tuoi materiali</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1530">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy-900:#070d1f;--navy-800:#0b1530;--navy-700:#11204a;--navy-600:#1a2d63;
  --orange:#ef7d2d;--orange-2:#f59a4a;--gold:#d9b46a;--blue:#2563eb;--terra:#c95a14;
  --panel:#f1f3f9;--ink:#0f1a3a;--muted:#7a83a3;--line:#e6e9f2;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;text-align:left}
input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg{display:block;flex:none}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:8px}

.app{display:grid;grid-template-columns:250px 420px 1fr;min-height:100vh}

/* sidebar */
.side{padding:32px 20px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;line-height:1.05}
.logo-mark{width:40px;height:40px;border-radius:50%;background:var(--navy-800);color:var(--orange);display:grid;place-items:center;font-size:21px}
.logo small{display:block;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.nav-t{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin:40px 12px 10px}
.nav{display:grid;gap:4px}
.nav button,.nav a{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:12px;color:var(--muted);font-weight:600;font-size:13.5px;width:100%;line-height:1.3}
.nav .ni{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none;background:var(--panel)}
.nav .on{color:var(--ink);background:var(--panel)}
.nav .on .ni{background:var(--orange);color:#fff;box-shadow:0 8px 18px rgba(239,125,45,.35)}
.nav button:hover,.nav a:hover{color:var(--ink)}
.side-card{margin-top:auto;background:var(--navy-800);color:#fff;border-radius:18px;padding:20px}
.side-card b{display:block;font-size:14px;margin-bottom:4px}
.side-card p{font-size:12.5px;color:#c3cbe6;line-height:1.5}

/* middle */
.mid{background:var(--panel);border-radius:34px;margin:14px 0;padding:34px 28px;overflow:auto;max-height:calc(100vh - 28px);position:sticky;top:14px}
.mid h1{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.mid .sub{color:var(--orange);font-weight:700;font-size:14px;margin-top:6px}
.count{display:flex;gap:10px;margin:22px 0 26px}
.count div{flex:1;background:#fff;border-radius:16px;padding:14px 16px}
.count b{display:block;font-size:22px;line-height:1.1}
.count span{font-size:12px;color:var(--muted)}
.mods-t{font-size:17px;color:var(--muted);font-weight:600;margin-bottom:14px}
.mods{display:grid;gap:14px}
.mod{border-radius:20px;padding:18px;color:#fff;display:grid;grid-template-columns:50px 1fr 62px;gap:14px;align-items:center;width:100%;transition:transform .2s,box-shadow .2s}
.mod:hover{transform:translateY(-2px)}
.mod.sel{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--orange)}
.mod.light{color:var(--navy-800)}
.mod .ci{width:50px;height:50px;border-radius:14px;background:rgba(255,255,255,.16);display:grid;place-items:center}
.mod.light .ci{background:rgba(11,21,48,.08)}
.mod small{font-size:11px;font-weight:800;letter-spacing:.12em;opacity:.8}
.mod h3{font-size:15px;line-height:1.3;font-weight:800;margin-top:2px}
.mod .num{background:#fff;color:var(--navy-800);border-radius:12px;text-align:center;padding:8px 4px}
.mod .num b{display:block;font-size:19px;line-height:1.1}
.mod .num span{font-size:10px;color:var(--muted)}

/* right */
.right{padding:34px 36px 60px;min-width:0}
.search{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:13px 16px;color:var(--muted)}
.search input{border:0;outline:0;flex:1;background:none;color:var(--ink)}
.back{display:none;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--muted);margin:16px 0 0}
.mh{display:flex;align-items:center;gap:16px;margin:30px 0 8px}
.mh .ci{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:#fff}
.mh small{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--orange);text-transform:uppercase}
.mh h2{font-size:22px;line-height:1.25;letter-spacing:-.01em}
.mdesc{color:var(--muted);font-size:14px;margin-bottom:20px}
.docs{display:grid;gap:10px}
.doc{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.doc .di{width:40px;height:40px;border-radius:11px;background:var(--panel);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--navy-700)}
.doc b{font-size:14px;display:block;line-height:1.35}
.doc small{font-size:12px;color:var(--muted)}
.doc .ok{color:#16a34a;font-weight:700}
.acts{display:flex;gap:8px}
.dl{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:10px;font-size:12px;font-weight:800}
.dl.w{background:var(--navy-800);color:#fff}
.dl.p{background:#fdeee2;color:var(--terra)}
.none{color:var(--muted);font-size:14px;padding:30px 0;text-align:center}
.guide{display:grid;gap:12px;margin-top:26px}
.step{border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;grid-template-columns:34px 1fr;gap:14px}
.step i{width:34px;height:34px;border-radius:10px;background:var(--orange);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:800}
.step b{display:block;margin-bottom:3px}
.step p{font-size:14px;color:#4a5375;line-height:1.55}
.note{background:var(--panel);border-left:4px solid var(--orange);border-radius:8px;padding:14px 16px;font-size:13px;color:#4a5375;line-height:1.55}

.nav-t2{margin-top:26px}
.star{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#c0c6d8}
.star.on{color:var(--gold)}
.star.on svg{fill:currentColor}
.hello{display:flex;align-items:center;gap:12px;margin-bottom:22px;width:100%}
.avatar{width:44px;height:44px;border-radius:14px;background:var(--navy-700);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.hello b{display:block;font-size:15px}
.hello small{font-size:12px;color:var(--orange);font-weight:700}
/* agenda */
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);margin-top:8px}
.tabs button{padding:10px 0;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);font-weight:700;border-color:var(--ink)}
.tabs .add{margin:0 0 6px auto;padding:9px 14px;border-bottom:0;white-space:nowrap}
.tabs button{white-space:nowrap}
.add{margin-left:auto;display:inline-flex;align-items:center;gap:8px;background:var(--orange);color:#fff;font-weight:800;font-size:13px;padding:10px 16px;border-radius:12px;box-shadow:0 8px 18px rgba(239,125,45,.3)}
.grid-wrap{overflow-x:auto}
.week{position:relative;display:grid;grid-template-columns:48px repeat(6,minmax(72px,1fr));min-width:540px}
.week .dh{text-align:center;font-size:12px;font-weight:700;padding:12px 0}
.week .dh small{display:block;color:var(--muted);font-weight:500}
.week .dh.today{color:var(--orange)}
.week .tc{font-size:10px;color:var(--muted);height:44px;padding-top:2px}
.week .cell{border-left:1px solid var(--line);border-top:1px dashed var(--line);height:44px;cursor:pointer}
.week .cell:hover{background:#fff7f1}
.appt{position:absolute;border-radius:8px;padding:3px 8px;font-size:11px;font-weight:700;color:#fff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;box-shadow:0 6px 14px rgba(15,26,58,.15);cursor:pointer}
.hint{font-size:13px;color:var(--muted);margin:12px 0 0}
.modal{position:fixed;inset:0;background:rgba(7,13,31,.55);display:none;place-items:center;z-index:60;padding:20px}
.modal.on{display:grid}
.box{background:#fff;border-radius:22px;padding:26px;width:100%;max-width:420px;display:grid;gap:14px}
.box h3{font-size:18px}
.box label{font-size:12px;font-weight:700;color:var(--muted);display:grid;gap:6px}
.box input,.box select{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;font:inherit;color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.colors{display:flex;gap:10px}
.colors button{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.colors button.on{border-color:var(--ink)}
.box-acts{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.btn{padding:12px 18px;border-radius:12px;font-weight:800;font-size:14px}
.btn.pri{background:var(--orange);color:#fff}
.btn.sec{background:var(--panel)}
.btn.del{color:#dc2626;margin-right:auto}
.bnav{display:none}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--navy-800);color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:70;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
@media(max-width:1200px){
  .app{grid-template-columns:84px 380px 1fr}
  .side{padding:28px 14px;align-items:center}
  .logo span,.nav-t,.nav .lbl,.side-card{display:none}
  .nav button,.nav a{justify-content:center;padding:6px}
}
@media(max-width:860px){
  .app{display:block}
  .side{display:none}
  .mid{position:static;max-height:none;margin:0;border-radius:0 0 28px 28px;padding:calc(28px + env(safe-area-inset-top,0px)) 18px 28px}
  .right{padding:24px 18px 50px}
  body.open .mid{display:none}
  body:not(.open) .right .module{display:none}
  body.open .back{display:inline-flex}
  body:not(.open) .mod.sel{box-shadow:none}
  .tabs{gap:16px;font-size:12px}
  .doc{grid-template-columns:36px 1fr}
  .doc .di{width:36px;height:36px}
  .acts{grid-column:2}
  body{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
  .bnav{display:flex;justify-content:space-around;position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
  .bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);padding:4px 10px;text-align:center}
  .bnav button.on{color:var(--orange)}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><div class="logo-mark">Ψ</div><span>Modulistica<small>Psicologo</small></span></div>
    <div class="nav-t">Moduli</div>
    <nav class="nav" id="nav"></nav>
    <div class="nav-t nav-t2">Strumenti</div>
    <nav class="nav" id="nav2"></nav>
    <div class="side-card"><b>Accesso a vita</b><p>Scarica i modelli tutte le volte che vuoi. Gli aggiornamenti del kit appaiono qui.</p></div>
  </aside>
  <section class="mid" id="mid"></section>
  <main class="right" id="right"></main>
</div>
<nav class="bnav" id="bnav"></nav>
<div class="toast" id="toast" role="status"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="box">
    <h3 id="mTitle">Nuovo appuntamento</h3>
    <label>Paziente o nota<input id="mText" maxlength="40" placeholder="Es. Colloquio con M. R."></label>
    <div class="row2">
      <label>Giorno<select id="mDay"></select></label>
      <label>Settimana<select id="mWeek"><option value="0">Questa settimana</option><option value="1">Prossima settimana</option></select></label>
    </div>
    <div class="row2">
      <label>Inizio<select id="mStart"></select></label>
      <label>Fine<select id="mEnd"></select></label>
    </div>
    <label>Colore<div class="colors" id="mColors"></div></label>
    <div class="box-acts">
      <button class="btn del" id="mDel" hidden>Elimina</button>
      <button class="btn sec" id="mCancel">Annulla</button>
      <button class="btn pri" id="mSave">Salva</button>
    </div>
  </div>
</div>

function esc(s){return String(s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}

/* VIEW: 1..6 modulo, 'fav', 'agenda', 'guida' */
var V=1,Q='';
function nDone(){return Object.keys(S.dl).length}
function nFav(){return Object.keys(S.fav).length}

function nav(){
  document.getElementById('nav').innerHTML=CATS.map(function(c){return '<button data-v="'+c.id+'" class="'+(V===c.id&&!Q?'on':'')+'"><span class="ni">'+ROM[c.id-1]+'</span><span class="lbl">'+esc(c.s)+'</span></button>'}).join('');
  var t=[['fav','star','Preferiti'],['agenda','cal','Agenda'],['guida','guide','Come usare il kit']];
  document.getElementById('nav2').innerHTML=t.map(function(x){return '<button data-v="'+x[0]+'" class="'+(V===x[0]&&!Q?'on':'')+'"><span class="ni">'+ic(x[1],16)+'</span><span class="lbl">'+x[2]+'</span></button>'}).join('');
  var b=[['home','grid','Moduli'],['fav','star','Preferiti'],['agenda','cal','Agenda'],['guida','guide','Guida']];
  var open=document.body.classList.contains('open');
  document.getElementById('bnav').innerHTML=b.map(function(x){var on=x[0]==='home'?(!open||typeof V==='number'):(open&&V===x[0]);return '<button data-v="'+x[0]+'" class="'+(on?'on':'')+'">'+ic(x[1],20)+x[2]+'</button>'}).join('');
}
function mid(){
  var ini=(S.name||'?').split(/\s+/).filter(Boolean).map(function(w){return w[0]}).join('').slice(0,2).toUpperCase();
  document.getElementById('mid').innerHTML=
  '<button class="hello" data-name title="Modifica il tuo nome"><span class="avatar">'+esc(ini)+'</span><span><b>'+(S.name?'Ciao, '+esc(S.name)+'!':'Benvenuto/a!')+'</b><small>'+(S.name?'Modifica nome':'Tocca qui per inserire il tuo nome')+'</small></span></button>'+
  '<h1>I tuoi materiali</h1><div class="sub">Modulistica Psicologo Pronta all\'Uso</div>'+
  '<div class="count"><div><b>120</b><span>modelli</span></div><div><b>'+nDone()+'</b><span>scaricati</span></div><div><b>'+nFav()+'</b><span>preferiti</span></div></div>'+
  '<div class="mods-t">Scegli un modulo</div><div class="mods">'+CATS.map(function(c){
    return '<button class="mod'+(c.light?' light':'')+(V===c.id&&!Q?' sel':'')+'" style="background:'+c.c+'" data-v="'+c.id+'"><span class="ci">'+ic(c.ic,25,1.8)+'</span><span><small>MODULO '+ROM[c.id-1]+'</small><h3>'+esc(c.t)+'</h3></span><span class="num"><b>'+c.docs.length+'</b><span>modelli</span></span></button>'}).join('')+'</div>';
}
function row(d,showCat){
  return '<div class="doc"><span class="di">'+d.nn+'</span><span><b>'+esc(d.name)+'</b><small>'+(showCat?'Modulo '+ROM[d.cat.id-1]+' · ':'')+(S.dl[d.id]?'<span class="ok">✓ Scaricato</span>':'Word e PDF')+'</small></span>'+
  '<span class="acts"><button class="star'+(S.fav[d.id]?' on':'')+'" data-fav="'+d.id+'" aria-label="'+(S.fav[d.id]?'Rimuovi dai preferiti':'Aggiungi ai preferiti')+'" title="Preferito">'+ic('star',18)+'</button>'+
  '<a class="dl w" href="'+d.path+'.docx" download data-dl="'+d.id+'">'+ic('down',14,2.4)+'Word</a><a class="dl p" href="'+d.path+'.pdf" download data-dl="'+d.id+'">'+ic('down',14,2.4)+'PDF</a></span></div>';
}
function head(icon,color,small,title,dark){return '<div class="mh"><span class="ci" style="background:'+color+(dark?';color:#0b1530':'')+'">'+ic(icon,26,1.8)+'</span><div><small>'+small+'</small><h2>'+title+'</h2></div></div>'}

/* AGENDA */
var DAYS=['Lun','Mar','Mer','Gio','Ven','Sab'],H0=7,H1=21,ROW=44,WEEK=0,COLS=['#ef7d2d','#11204a','#d9b46a','#2563eb','#c95a14'];
function monday(off){var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+off*7);return d}
function wkKey(off){var m=monday(off);return m.getFullYear()+'-'+(m.getMonth()+1)+'-'+m.getDate()}
function agendaHTML(){
  var m=monday(WEEK),td=new Date();td.setHours(0,0,0,0);
  var h=head('cal','#11204a','Strumenti','Agenda delle sedute')+'<p class="mdesc">Organizza i tuoi appuntamenti della settimana. Tocca uno spazio libero per aggiungerne uno. I dati restano solo su questo dispositivo.</p>';
  h+='<div class="tabs"><button data-wk="0" class="'+(WEEK===0?'on':'')+'">Questa settimana</button><button data-wk="1" class="'+(WEEK===1?'on':'')+'">Prossima settimana</button><button class="add" data-add>'+ic('plus',16,2.6)+'Nuovo</button></div>';
  h+='<div class="grid-wrap"><div class="week" id="week"><div></div>';
  DAYS.forEach(function(d,i){var x=new Date(m);x.setDate(m.getDate()+i);h+='<div class="dh'+(+x===+td?' today':'')+'">'+d+'<small>'+x.getDate()+'/'+(x.getMonth()+1)+'</small></div>'});
  for(var t=H0;t<H1;t++){h+='<div class="tc">'+String(t).padStart(2,'0')+':00</div>';for(var i=0;i<6;i++)h+='<div class="cell" data-slot="'+i+'-'+t+'"></div>'}
  return h+'</div></div>';
}
function drawAppts(){
  var wk=document.getElementById('week');if(!wk)return;
  wk.querySelectorAll('.appt').forEach(function(e){e.remove()});
  var hd=wk.querySelector('.dh').offsetHeight,cw=(wk.offsetWidth-48)/6;
  S.ap.forEach(function(a,idx){if(a.w!==wkKey(WEEK))return;
    var el=document.createElement('div');el.className='appt';el.style.background=a.c;if(a.c==='#d9b46a')el.style.color='#0b1530';
    el.style.left=(48+a.d*cw+4)+'px';el.style.width=(cw-8)+'px';el.style.top=(hd+(a.s-H0)*ROW+3)+'px';el.style.height=((a.e-a.s)*ROW-6)+'px';
    el.textContent=a.t;el.title=a.t;el.onclick=function(ev){ev.stopPropagation();openModal(idx)};wk.appendChild(el)});
}
var EDIT=-1,MC=COLS[0];
function $(id){return document.getElementById(id)}
function openModal(idx,day,hour){
  EDIT=idx;var a=idx>=0?S.ap[idx]:{t:'',d:day||0,s:hour||9,e:(hour||9)+1,c:COLS[0]};
  $('mTitle').textContent=idx>=0?'Modifica appuntamento':'Nuovo appuntamento';$('mText').value=a.t;
  $('mDay').innerHTML=DAYS.map(function(d,i){return '<option value="'+i+'"'+(i==a.d?' selected':'')+'>'+d+'</option>'}).join('');
  var hs='';for(var t=H0;t<=H1;t++)hs+='<option value="'+t+'">'+String(t).padStart(2,'0')+':00</option>';
  $('mStart').innerHTML=hs;$('mEnd').innerHTML=hs;$('mStart').value=a.s;$('mEnd').value=a.e;$('mWeek').value=String(WEEK);
  MC=a.c;paint();$('mDel').hidden=idx<0;$('modal').classList.add('on');$('mText').focus();
}
function paint(){$('mColors').innerHTML=COLS.map(function(c){return '<button type="button" data-c="'+c+'" class="'+(c===MC?'on':'')+'" style="background:'+c+'" aria-label="Colore"></button>'}).join('')}
$('mColors').onclick=function(e){var b=e.target.closest('[data-c]');if(b){MC=b.dataset.c;paint()}};
function closeModal(){$('modal').classList.remove('on')}
$('mCancel').onclick=closeModal;$('modal').onclick=function(e){if(e.target.id==='modal')closeModal()};
$('mDel').onclick=function(){S.ap.splice(EDIT,1);save();closeModal();render()};
$('mSave').onclick=function(){var s=+$('mStart').value,e=+$('mEnd').value;if(e<=s)e=s+1;var wk=+$('mWeek').value;
  var a={t:$('mText').value.trim()||'Appuntamento',d:+$('mDay').value,s:s,e:Math.min(e,H1),c:MC,w:wkKey(wk)};
  if(EDIT>=0)S.ap[EDIT]=a;else S.ap.push(a);WEEK=wk;save();closeModal();render()};

function right(){
  var h='<label class="search">'+ic('search',18)+'<input id="q" placeholder="Cerca un modello tra i 120" value="'+esc(Q)+'" aria-label="Cerca"></label>';
  h+='<div class="module"><button class="back" data-back>'+ic('back',18)+'Torna ai moduli</button>';
  if(Q){
    var r=DOCS.filter(function(d){return d.name.toLowerCase().indexOf(Q)>-1});
    h+='<div class="mh"><div><small>Risultati</small><h2>'+r.length+' modelli trovati</h2></div></div><div class="docs">'+(r.length?r.map(function(d){return row(d,1)}).join(''):'<p class="none">Nessun modello trovato.</p>')+'</div>';
  }else if(V==='fav'){
    var f=DOCS.filter(function(d){return S.fav[d.id]});
    h+=head('star','#d9b46a','Strumenti','I tuoi preferiti',1)+'<p class="mdesc">I modelli che usi di più, sempre a portata di mano.</p><div class="docs">'+(f.length?f.map(function(d){return row(d,1)}).join(''):'<p class="none">Non hai ancora preferiti. Tocca la stella ☆ accanto a un modello per salvarlo qui.</p>')+'</div>';
  }else if(V==='agenda'){
    h+=agendaHTML();
  }else if(V==='guida'){
    var st=[['Scegli il modulo','Ogni modulo raccoglie i modelli di un\'area della tua pratica. Puoi anche cercare un modello per nome.'],['Scarica Word o PDF','Word per modificare e personalizzare. PDF per stampare e compilare a mano.'],['Salva i preferiti','Tocca la stella accanto ai modelli che usi di più: li trovi nella sezione Preferiti.'],['Personalizza l\'intestazione','Inserisci i dati del tuo studio e il numero di iscrizione all\'Albo, poi salva una copia come tuo modello.'],['Organizza l\'agenda','Segna le sedute della settimana nell\'Agenda. I dati restano solo sul tuo dispositivo.']];
    h+=head('guide','#ef7d2d','Guida','Come usare il kit')+'<div class="guide">'+st.map(function(s,i){return '<div class="step"><i>'+(i+1)+'</i><div><b>'+s[0]+'</b><p>'+s[1]+'</p></div></div>'}).join('')+
    '<div class="note"><b>Nota:</b> i modelli sono strumenti di supporto e non sostituiscono il giudizio clinico del professionista. Adattali sempre al caso e alle indicazioni del tuo Ordine regionale.</div></div>';
  }else{
    var c=CATS[V-1];
    h+=head(c.ic,c.c,'Modulo '+ROM[c.id-1]+' · '+c.docs.length+' modelli',esc(c.t),c.light)+'<p class="mdesc">'+esc(c.d)+'</p><div class="docs">'+DOCS.filter(function(d){return d.cat.id===c.id}).map(function(d){return row(d,0)}).join('')+'</div>';
  }
  $('right').innerHTML=h+'</div>';
  drawAppts();
  var q=$('q');q.oninput=function(){var p=q.selectionStart;Q=q.value.trim().toLowerCase();if(Q)document.body.classList.add('open');render();var n=$('q');n.focus();n.setSelectionRange(p,p)};
}
function render(){nav();mid();right()}
var TT;function toast(m){var x=$('toast');x.textContent=m;x.classList.add('on');clearTimeout(TT);TT=setTimeout(function(){x.classList.remove('on')},2600)}

document.addEventListener('click',function(e){
  var t;
  if(t=e.target.closest('[data-v]')){var v=t.dataset.v;Q='';
    if(v==='home'){document.body.classList.remove('open')}else{V=isNaN(+v)?v:+v;document.body.classList.add('open')}
    render();window.scrollTo(0,0);return}
  if(t=e.target.closest('[data-back]')){Q='';document.body.classList.remove('open');render();window.scrollTo(0,0);return}
  if(t=e.target.closest('[data-fav]')){var k=t.dataset.fav;if(S.fav[k])delete S.fav[k];else S.fav[k]=1;save();render();return}
  if(t=e.target.closest('[data-dl]')){e.preventDefault();var href=t.getAttribute('href'),id=t.dataset.dl;
    fetch(href,{method:'HEAD',cache:'no-store'}).then(function(r){
      if(!r.ok)throw 0;var a=document.createElement('a');a.href=href;a.download=href.split('/').pop();document.body.appendChild(a);a.click();a.remove();
      S.dl[id]=1;save();toast('Download avviato');setTimeout(render,400);
    }).catch(function(){toast('Questo modello è in aggiornamento. Riprova tra poco.')});return}
  if(t=e.target.closest('[data-add]')){openModal(-1);return}
  if(t=e.target.closest('[data-wk]')){WEEK=+t.dataset.wk;render();return}
  if(t=e.target.closest('[data-slot]')){var p=t.dataset.slot.split('-');openModal(-1,+p[0],+p[1]);return}
  if(t=e.target.closest('[data-name]')){var n=prompt('Come vuoi essere chiamato/a? (es. Dott.ssa Rossi)',S.name);if(n!==null){S.name=n.trim().slice(0,30);save();render()}}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});
window.addEventListener('resize',drawAppts);
render();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
</html>
